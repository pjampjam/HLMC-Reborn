# /etc/systemd/system/minecraft.service.d/jvm.conf
# Fixed 6 GB heap with Aikar's G1 flags: fewer and shorter GC pauses on the 2-core A1 VM.
# Raise -Xms/-Xmx together (for example to 10G) if the VM is resized to 24 GB.
[Service]
ExecStart=
ExecStart=/usr/lib/jvm/java-25-openjdk-arm64/bin/java -Xms6G -Xmx6G -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20 -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4 -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32 -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1 -jar server.jar nogui
